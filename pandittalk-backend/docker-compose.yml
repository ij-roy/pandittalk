services:
  postgres:
    image: postgres:16-alpine
    container_name: pandittalk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pandittalk
      POSTGRES_PASSWORD: pandittalk
      POSTGRES_DB: pandittalk
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pandittalk -d pandittalk']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pandittalk-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pandittalk-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pandittalk
      RABBITMQ_DEFAULT_PASS: pandittalk
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7-jammy
    container_name: pandittalk-mongo
    restart: unless-stopped
    command: ['mongod', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep 1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
