name: pandittalk-local

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Explicit disposable local fallback for CI and isolated demos.
# This file must be combined with docker-compose.yml:
# docker compose -f docker-compose.yml -f docker-compose.local.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: pandittalk
      POSTGRES_PASSWORD: pandittalk-local-only
      POSTGRES_DB: pandittalk
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pandittalk -d pandittalk']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1000']
    expose:
      - '6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    logging: *default-logging
    command: ['mongod', '--bind_ip_all']
    expose:
      - '27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pandittalk:pandittalk-local-only@postgres:5432/pandittalk?schema=public&connection_limit=10&pool_timeout=20
      DIRECT_URL: postgresql://pandittalk:pandittalk-local-only@postgres:5432/pandittalk?schema=public&connection_limit=10&pool_timeout=20
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: pandittalk
      # Disposable local/CI value only. Production injects JWT_SECRET from Secrets Manager.
      JWT_SECRET: local-ci-only-do-not-use-in-production
      # Keep the disposable stack independent of external SMS credentials.
      # Production continues to use its injected OTP provider configuration.
      OTP_SMS_PROVIDER: none
      ALLOW_TEST_OTP: 'false'
      AVATAR_STORAGE: local
      AVATAR_PUBLIC_BASE_URL: http://localhost:3001/static/avatars
      COOKIE_SECURE: 'false'
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8081

volumes:
  postgres_data:
  redis_data:
  mongo_data:
