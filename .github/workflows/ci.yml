name: PanditTalk CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pandittalk-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pandittalk-backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run lint:check
      - run: npm test -- --runInBand
      - run: npm run typecheck
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pandittalk-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pandittalk-website/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Run browser journeys and responsive checks
        env:
          SESSION_SECRET: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
        run: npm run test:ui
      - run: npm run lint
      - run: npm run build

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pandittalk-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pandittalk-dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pandittalk-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pandittalk-mobile/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:webview-allowlist
      - run: npx expo export --platform web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create safe local runtime configuration
        shell: bash
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml config --quiet
      - name: Build backend runtime image
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml build api pandit-service
      - name: Start the local stack
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
      - name: Wait for the API through Caddy
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3001/readiness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          curl --fail http://localhost:3001/readiness
      - name: Verify dependencies and Socket.IO handshake
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T redis redis-cli ping
          docker compose -f docker-compose.yml -f docker-compose.local.yml exec -T postgres pg_isready -U pandittalk -d pandittalk
          curl --fail 'http://localhost:3001/socket.io/?EIO=4&transport=polling'
      - name: Verify scheduled and Chat Now booking quotes
        shell: bash
        run: |
          catalog="$(curl --fail --silent http://localhost:3001/booking-catalog)"
          echo "$catalog" | jq -e '
            .sessionModel == "legacy_timed" and
            (.scheduled.depths | length > 0) and
            (.scheduled.formats | map(.key) | index("audio") != null) and
            (.scheduled.formats | map(.key) | index("video") != null) and
            .chatNow.enabled == true and
            .chatNow.durationMinutes > 0 and
            .chatNow.totalPrice > 0
          '
          while IFS=$'\t' read -r depth format; do
            scheduled_quote="$(curl --fail --silent "http://localhost:3001/booking-catalog/quote?depth=${depth}&format=${format}")"
            expected_depth="$(echo "$catalog" | jq -c --arg depth "$depth" '.scheduled.depths[] | select(.key == $depth)')"
            expected_format="$(echo "$catalog" | jq -c --arg format "$format" '.scheduled.formats[] | select(.key == $format)')"
            jq -e --arg depth "$depth" --arg format "$format" --argjson expectedDepth "$expected_depth" --argjson expectedFormat "$expected_format" '
              .sessionModel == "legacy_timed" and
              .depth == $depth and
              .format == $format and
              .durationMinutes == $expectedDepth.durationMinutes and
              .totalPrice == ($expectedDepth.basePrice + $expectedFormat.surcharge) and
              .coinsDeducted == .totalPrice
            ' <<<"$scheduled_quote"
          done < <(echo "$catalog" | jq -r '.scheduled.depths[] as $depth | .scheduled.formats[] | [$depth.key, .key] | @tsv')
          chat_now_quote="$(curl --fail --silent 'http://localhost:3001/booking-catalog/quote?mode=chat-now')"
          echo "$chat_now_quote" | jq -e '
            .sessionModel == "legacy_timed" and
            .format == "chat" and
            .durationMinutes > 0 and
            .totalPrice > 0 and
            .coinsDeducted == .totalPrice
          '
      - name: Verify two API replicas remain reachable
        run: |
          docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --scale api=2 --no-recreate api proxy
          curl --fail http://localhost:3001/
      - name: Show API logs when the stack fails
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml logs --no-color --tail=200 api
      - name: Show service state
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml ps
      - name: Tear down local stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml down -v

  secret-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked environment and credential files
        shell: bash
        run: |
          tracked="$(git ls-files | grep -E '(^|/)\.env($|\.local$|\.production$)|(^|/)(google-services\.json|GoogleService-Info\.plist|credentials\.json|razorpaykeys\.txt|.*\.(pem|key|p12))$' || true)"
          if [ -n "$tracked" ]; then
            echo "Tracked secret-like files found:"
            echo "$tracked"
            exit 1
          fi
      - name: Check the committed examples contain no private-key block
        shell: bash
        run: |
          if git grep -n --exclude='*.lock' -- 'BEGIN [A-Z ]* PRIVATE KEY'; then
            exit 1
          fi
