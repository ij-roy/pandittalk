name: pandittalk

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Production/runtime Compose file.
# PostgreSQL, Redis, MongoDB, and media are managed outside Docker:
# Supabase, Redis Cloud, MongoDB Atlas, and Cloudinary respectively.
# Use docker-compose.local.yml only for an explicit disposable local demo.

services:
  api:
    build:
      context: ./pandittalk-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      NODE_ENV: production
      USER_SERVICE_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-}
      DIRECT_URL: ${DIRECT_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-}
      MONGODB_URI: ${MONGODB_URI:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-pandittalk}
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      WEBRTC_TURN_URL: ${WEBRTC_TURN_URL:-}
      WEBRTC_TURN_USERNAME: ${WEBRTC_TURN_USERNAME:-}
      WEBRTC_TURN_CREDENTIAL: ${WEBRTC_TURN_CREDENTIAL:-}
      CLOUDFLARE_TURN_KEY_ID: ${CLOUDFLARE_TURN_KEY_ID:-}
      CLOUDFLARE_TURN_API_TOKEN: ${CLOUDFLARE_TURN_API_TOKEN:-}
      CLOUDFLARE_TURN_CREDENTIAL_TTL_SECONDS: ${CLOUDFLARE_TURN_CREDENTIAL_TTL_SECONDS:-86400}
      AVATAR_STORAGE: ${AVATAR_STORAGE:-cloudinary}
      AVATAR_UPLOAD_DIR: /app/uploads/avatars
      AVATAR_PUBLIC_BASE_URL: ${AVATAR_PUBLIC_BASE_URL:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-pandittalk}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_TEST_OTP: ${ALLOW_TEST_OTP:-false}
    volumes:
      - media_data:/app/uploads
    command: ['sh', '-c', 'npx prisma migrate deploy --schema apps/user-service/prisma/schema.prisma && node dist/apps/user-service/main.js']
    expose:
      - '3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  pandit-service:
    build:
      context: ./pandittalk-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PANDIT_SERVICE_PORT: 3002
    depends_on:
      api:
        condition: service_healthy
    command: ['node', 'dist/apps/pandit-service/main.js']
    expose:
      - '3002'

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - '${API_EXTERNAL_PORT:-3001}:80'
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      pandit-service:
        condition: service_started

  turn:
    image: coturn/coturn:4.6
    profiles: ['webrtc']
    restart: unless-stopped
    logging: *default-logging
    command:
      - '--no-cli'
      - '--fingerprint'
      - '--lt-cred-mech'
      - '--realm=${TURN_REALM:-localhost}'
      - '--user=${TURN_USERNAME:-pandittalk}:${TURN_PASSWORD:-local-turn-password}'
      - '--log-file=stdout'
    ports:
      - '${TURN_PORT:-3478}:3478/tcp'
      - '${TURN_PORT:-3478}:3478/udp'

volumes:
  media_data:
  caddy_data:
  caddy_config:
