plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.panditchime'
version = '1.0.0'

android {
  namespace "expo.modules.panditchime"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation('software.aws.chimesdk:amazon-chime-sdk:0.25.3') {
    exclude group: 'software.aws.chimesdk', module: 'amazon-chime-sdk-media'
    exclude group: 'software.aws.chimesdk', module: 'amazon-chime-sdk-machine-learning'
  }
  implementation 'software.aws.chimesdk:amazon-chime-sdk-media:0.25.2'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
